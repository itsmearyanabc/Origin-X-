# Local development services. Production uses Supabase (database) and docker-compose.prod.yml.
#   docker compose up -d        -> Postgres on localhost:5434 (databases: originx, originx_test)
services:
  postgres:
    image: postgres:17-alpine
    container_name: originx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: originx
      POSTGRES_PASSWORD: originx_local_dev
      POSTGRES_DB: originx
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - originx-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U originx -d originx"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  originx-pgdata:
