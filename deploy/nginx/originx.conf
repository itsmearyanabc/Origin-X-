# ORIGINX — nginx on the VPS. Serves the built web app (/usr/share/nginx/html) and proxies the API.
# Cloudflare terminates public TLS and proxies to this server over TLS using a Cloudflare Origin
# Certificate (SSL mode: Full (strict)). App and API share one origin, so the httpOnly session
# cookie (path /api/v1/auth, SameSite=Lax) works without CORS.

# Rate-limit by the real visitor IP (Cloudflare header), falling back to the TCP peer when absent.
map $http_cf_connecting_ip $originx_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $originx_client zone=originx_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 200k;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container health probe (local only).
    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------- API
    location ~ ^/(api/|health$|ready$) {
        limit_req zone=originx_api burst=40 nodelay;
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 90s;
        # The API sets its own security headers (helmet); only HSTS is added here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ---------------------------------------------------------------- Web app
    # Fingerprinted build assets never change — cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Claude's supplied Design Canvas export is a self-contained bundle. Its
    # bootloader reconstructs the page using inline code and blob URLs, so it
    # needs a compatibility policy that is intentionally limited to this path.
    location ^~ /claude-design/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Everything else is the single-page app; index.html is never cached so deploys apply at once.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # camera=(self): the public verify page can scan QR codes.
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
        # The Claude-designed landing bundle is served from this same origin in
        # the public React shell. Allow self-framing while still blocking every
        # external site from embedding ORIGINX.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
